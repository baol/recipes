{#- Theme logo with explicit size, so the browser reserves its space while loading. -#}
{% if config.theme.logo %}
  <img src="{{ config.theme.logo | url }}" alt="{{ config.site_name }}" width="236" height="127">
{% else %}
  {% set icon = config.theme.icon.logo or "material/library" %}
  {% include ".icons/" ~ icon ~ ".svg" %}
{% endif %}
