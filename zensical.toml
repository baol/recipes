[project]
site_name = "Le Ricette di Daniela e Mirko"
site_url = "https://maischberger.it/"
repo_url = "https://github.com/baol/recipes"
copyright = "Copyright ©️ 2025 Daniela & Mirko Maischberger"

[project.plugins.search]
[project.plugins.tags]

[project.theme]
name = "material"
favicon = "images/icon-512x512.png"
custom_dir = "overrides"
language = "it"
logo = "images/100allora.png"
features = ["search.suggest"]

[project.theme.palette]
scheme = "slate"
primary = "white"
accent = "yellow"

[project.theme.font]
text = "Noto"

[project.extra.consent]
title = "Usiamo i cookie!"
description = "Utilizziamo i cookie per riconoscere le tue visite ripetute e le tue preferenze, nonché per misurare l'efficacia della nostra documentazione e se gli utenti trovano ciò che stanno cercando. Con il tuo consenso, ci aiuti a migliorare la nostra documentazione."

[project.extra.analytics]
provider = "google"
property = "G-X3S66S3427"

[project.extra.analytics.feedback]
title = "Questa pagina è stata utile?"

[[project.extra.analytics.feedback.ratings]]
icon = "material/emoticon-sad-outline"
name = "Questa pagina potrebbe essere migliorata"
data = 0
note = "Grazie per il tuo feedback! Aiutaci a migliorare questa pagina utilizzando il nostro <a href=\"https://github.com/baol/recipes/issues/new/?title=[Feedback]+{title}+-+{url}\" target=\"_blank\" rel=\"noopener\">modulo di feedback</a>."

[[project.extra.analytics.feedback.ratings]]
icon = "material/emoticon-happy-outline"
name = "Questa pagina è stata utile"
data = 1
note = "Grazie per il tuo feedback!"

# Preserve Zensical 0.0.64 defaults alongside the recipe extension.

[project.markdown_extensions."abbr"]

[project.markdown_extensions."admonition"]

[project.markdown_extensions."attr_list"]

[project.markdown_extensions."def_list"]

[project.markdown_extensions."footnotes"]

[project.markdown_extensions."md_in_html"]

[project.markdown_extensions."toc"]
permalink = true

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.betterem"]

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.keys"]

[project.markdown_extensions."pymdownx.magiclink"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.smartsymbols"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]

[project.markdown_extensions.recipe_seo]
